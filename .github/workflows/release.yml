name: Release

on:
  push:
    branches: [master]
    paths:
      - manifest.json
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read manifest
        id: manifest
        run: |
          echo "name=$(jq -r .name manifest.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version_number manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.manifest.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package zip
        if: steps.check.outputs.skip == 'false'
        run: |
          zip -r "${{ steps.manifest.outputs.name }}-${{ steps.manifest.outputs.version }}.zip" \
            manifest.json README.md icon.png config/

      - name: Create GitHub release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.manifest.outputs.version }}" \
            "${{ steps.manifest.outputs.name }}-${{ steps.manifest.outputs.version }}.zip" \
            --title "v${{ steps.manifest.outputs.version }}" \
            --notes "Automated release for manifest version ${{ steps.manifest.outputs.version }}"
